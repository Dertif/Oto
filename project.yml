name: Oto
options:
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 0.15.0
  WhisperSPM:
    url: https://github.com/ggerganov/whisper.spm.git
    branch: master
targets:
  Oto:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Oto
        excludes:
          - CLI/Main.swift
          - Resources/WhisperModels/**/.cache/**
          - Resources/WhisperModels/openai/whisper-base/config.json
          - Resources/WhisperModels/openai/whisper-base/tokenizer_config.json
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: WhisperSPM
        product: whisper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remi.oto
        INFOPLIST_FILE: Oto/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2V3Y2M9YFN
        CODE_SIGN_IDENTITY: Apple Development
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        PROVISIONING_PROFILE_SPECIFIER: ""
        "ARCHS[sdk=macosx*]": arm64
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
    scheme:
      testTargets:
        - OtoTests
  OtoCLI:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Oto/CLI
      - path: Oto/Model/STTBackend.swift
      - path: Oto/Model/DictationQualityPreset.swift
      - path: Oto/Model/TextRefinementMode.swift
      - path: Oto/Model/TextRefinementModels.swift
      - path: Oto/Model/WhisperCppModel.swift
      - path: Oto/Model/WhisperCppRuntimeModels.swift
      - path: Oto/Services/OtoLogger.swift
      - path: Oto/Services/TextRefining.swift
      - path: Oto/Services/TranscriptNormalizer.swift
      - path: Oto/Services/TextRefinementPolicy.swift
      - path: Oto/Services/AppleFoundationTextRefiner.swift
      - path: Oto/Services/AppleSpeechTranscriber.swift
      - path: Oto/Services/WhisperKitTranscriber.swift
      - path: Oto/Services/WhisperCppTranscriber.swift
      - path: Oto/Services/WaveFileDecoder.swift
      - path: Oto/Services/AudioFileTranscriptionService.swift
      - path: Oto/Resources/WhisperModels
        excludes:
          - "**/.cache/**"
          - openai/whisper-base/config.json
          - openai/whisper-base/tokenizer_config.json
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: WhisperSPM
        product: whisper
    settings:
      base:
        PRODUCT_NAME: oto
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oto CLI
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Oto CLI needs Speech Recognition access to transcribe local audio files.
        SWIFT_VERSION: 5.0
        CODE_SIGNING_ALLOWED: NO
        "ARCHS[sdk=macosx*]": arm64
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
    scheme: {}
  OtoTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: OtoTests
    dependencies:
      - target: Oto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        "ARCHS[sdk=macosx*]": arm64
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
